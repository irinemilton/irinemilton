name: Guestbook
description: Leave a message in Irine's guestbook
title: "Guestbook entry"
body:
  - type: input
    id: name
    attributes:
      label: Name
      description: How should your guestbook entry be signed?
      placeholder: "Example: Alex or @alex"
    validations:
      required: true
  - type: textarea
    id: message
    attributes:
      label: Message
      description: Leave a short message for Irine.
      placeholder: "Example: Great profile, Irine! I enjoyed learning about your projects."
    validations:
      required: true
