name: Generate 3D Contribution Profile

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: irinemilton

      - name: Publish generated profile
        run: |
          git fetch origin output
          git config user.name github-actions
          git config user.email github-actions@github.com
          cp -R profile-3d-contrib /tmp/profile-3d-contrib
          git switch --force --detach origin/output
          rm -rf profile-3d-contrib
          cp -R /tmp/profile-3d-contrib profile-3d-contrib
          git add profile-3d-contrib
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update 3D contribution profile"
          git push origin HEAD:output
